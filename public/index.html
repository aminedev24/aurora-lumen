<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aurora Lumen — Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #0b0d11;
        --panel: #121722;
        --text: #e5e7eb;
        --muted: #9aa4b2;
        --border: #2a3347;
        --accent: #00d1b2;
        --danger: #ff4d4f;
      }
      html, body {
        margin: 0; padding: 0; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
        height: 100%;
      }
      .wrap {
        min-height: 100vh; display: grid; place-items: center; padding: 16px;
      }
      .card {
        width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--border);
        border-radius: 12px; padding: 20px; box-sizing: border-box;
      }
      .brand {
        font-weight: 700; font-size: 18px; margin-bottom: 12px;
      }
      .muted { color: var(--muted); font-size: 13px; }
      .row { display: grid; gap: 6px; margin-top: 12px; }
      label { font-size: 13px; color: var(--muted); }
      input[type="password"] {
        width: 100%; padding: 10px 12px; border-radius: 8px; background: #0f1420; color: var(--text);
        border: 1px solid var(--border); outline: none;
      }
      input[type="password"]:focus { border-color: var(--accent); }
      .btn {
        width: 100%; margin-top: 16px; padding: 12px; border: 1px solid var(--border);
        border-radius: 10px; background: #162034; color: var(--text); cursor: pointer; font-weight: 600;
      }
      .btn:hover { filter: brightness(1.05); }
      .btn.primary { background: #0f2d2f; border-color: #184145; }
      .help { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
      .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
      .ok { color: var(--accent); font-size: 13px; margin-top: 8px; }
      .policy { font-size: 12px; color: var(--muted); margin-top: 10px; }
      .hide { display:none; }
      .token-warning { background: #2a0f0f; border: 1px solid #4b1515; color: #ffb3b3; padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">Aurora Lumen — Reset Password</div>
        <div id="tokenWarn" class="token-warning hide">Missing or invalid reset token. Please use the link from your email again.</div>

        <div class="row">
          <label for="newpass">New password</label>
          <input id="newpass" type="password" autocomplete="new-password" placeholder="Enter your new password" />
        </div>
        <div class="row">
          <label for="confpass">Confirm new password</label>
          <input id="confpass" type="password" autocomplete="new-password" placeholder="Re-enter your new password" />
        </div>

        <button id="submitBtn" class="btn primary">Reset Password</button>
        <div id="msg" class="help"></div>
        <div class="policy">
          Password must include at least 1 uppercase, 1 lowercase, and 1 number.
          Special characters like @ - . are optional but recommended.
        </div>
      </div>
    </div>

    <script>
      // ================== Config ==================
      const API_BASE = "https://api.aurora-lumen.com";
      // ============================================

      const qs = new URLSearchParams(window.location.search);
      const token = qs.get("token") || "";

      const tokenWarnEl = document.getElementById("tokenWarn");
      if (!token) tokenWarnEl.classList.remove("hide");

      const newpass = document.getElementById("newpass");
      const confpass = document.getElementById("confpass");
      const submitBtn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");

      function show(type, text) {
        msg.className = type === "ok" ? "ok" : type === "error" ? "error" : "help";
        msg.textContent = text || "";
      }

      function validPolicy(pw) {
        if (!/[A-Z]/.test(pw)) return "Must contain at least one uppercase letter";
        if (!/[a-z]/.test(pw)) return "Must contain at least one lowercase letter";
        if (!/[0-9]/.test(pw)) return "Must contain at least one number";
        if (pw.length < 6) return "Must be at least 6 characters";
        return "";
      }

      submitBtn.addEventListener("click", async () => {
        show("help", "");
        if (!token) {
          show("error", "Invalid or missing token. Please click the link from your email again.");
          return;
        }
        const pw = newpass.value.trim();
        const cpw = confpass.value.trim();

        if (!pw || !cpw) {
          show("error", "Please fill both password fields.");
          return;
        }
        if (pw !== cpw) {
          show("error", "Passwords do not match.");
          return;
        }
        const policyErr = validPolicy(pw);
        if (policyErr) {
          show("error", policyErr);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Resetting…";

        try {
          const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, new_password: pw })
          });
          if (!res.ok) {
            const t = await res.text();
            throw new Error(t || `HTTP ${res.status}`);
          }
          const data = await res.json().catch(() => ({}));
          show("ok", data?.message || "Password has been reset successfully. You can now log in.");
          submitBtn.textContent = "Done";
        } catch (e) {
          show("error", `Failed: ${e.message || e}`);
          submitBtn.disabled = false;
          submitBtn.textContent = "Reset Password";
        }
      });
    </script>
  </body>
</html>
